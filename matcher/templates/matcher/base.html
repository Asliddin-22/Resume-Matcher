<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Resume Matcher{% endblock %}</title>
  <style>
    :root {
      --bg: #f3efe6;
      --ink: #1c2430;
      --muted: #5d6b7c;
      --card: #fffdf8;
      --line: #d7d0c3;
      --accent: #0f6a5a;
      --accent-soft: #d8efe9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, #e7f2ee 0, transparent 40%),
        linear-gradient(180deg, #f7f3eb 0%, var(--bg) 100%);
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap {
      width: min(920px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.5rem 0 3rem;
    }
    .nav {
      display: flex;
      gap: 1rem;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .nav-links { display: flex; gap: 1rem; font-size: 0.95rem; }
    h1 { font-size: 2rem; margin: 0 0 0.4rem; letter-spacing: -0.03em; }
    .lead { color: var(--muted); margin: 0 0 1.5rem; max-width: 40rem; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1.25rem;
    }
    label { display: block; margin-bottom: 0.4rem; font-size: 0.95rem; }
    input[type="file"],
    input[type="search"],
    input[type="text"] {
      width: 100%;
      padding: 0.7rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      font: inherit;
    }
    button, .btn {
      display: inline-block;
      margin-top: 0.8rem;
      padding: 0.65rem 1rem;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font: inherit;
      cursor: pointer;
    }
    button:hover, .btn:hover { filter: brightness(0.95); text-decoration: none; }
    .message {
      margin-top: 1rem;
      padding: 0.75rem 0.9rem;
      background: var(--accent-soft);
      border-radius: 10px;
    }
    .jobs { list-style: none; padding: 0; margin: 1rem 0 0; }
    .jobs li {
      padding: 0.9rem 0;
      border-bottom: 1px solid var(--line);
    }
    .jobs li:last-child { border-bottom: 0; }
    .job-title { font-weight: 700; display: block; }
    .job-meta { color: var(--muted); font-size: 0.95rem; }
    .toolbar {
      display: flex;
      gap: 0.75rem;
      align-items: end;
      flex-wrap: wrap;
    }
    .toolbar .grow { flex: 1; min-width: 220px; }
    .meta-row {
      color: var(--muted);
      margin: 0 0 1rem;
      font-size: 0.95rem;
    }
    .pager {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }
    .detail-block { margin-top: 1.25rem; }
    .detail-block h2 {
      font-size: 1.05rem;
      margin: 0 0 0.4rem;
    }
    .detail-block p {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.5;
      color: #314050;
    }
    .facts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .fact {
      background: #f7faf8;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.75rem;
    }
    .fact span {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 0.2rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a class="brand" href="{% url 'home' %}">Resume Matcher</a>
      <div class="nav-links">
        <a href="{% url 'home' %}">Match resume</a>
        <a href="{% url 'browse_jobs' %}">Browse jobs</a>
      </div>
    </nav>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
